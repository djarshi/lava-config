name: Deploy Angular to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        # Exposes `base_path` output, e.g. /lava-config for a project Pages site.

      - name: Build Angular
        # `npm run build` runs `build:data` (generates src/app/configurator-data.ts
        # from configurator-input/) then `ng build`.
        # --base-href must match the GitHub Pages project URL path.
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: SPA fallback for GitHub Pages
        # GitHub Pages is a static server and would 404 on client-side routes
        # like /tweaks/lavapack. Serving a copy of index.html as 404.html lets
        # Angular bootstrap and the router take over the real URL.
        run: cp dist/lava-config2/browser/index.html dist/lava-config2/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular 18 application builder outputs to dist/<project>/browser
          path: dist/lava-config2/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4