name: Deploy Angular to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        # Exposes `base_path` output, e.g. /lava-config for a project Pages site.

      - name: Build Angular
        # `npm run build` runs `build:data` (generates src/app/configurator-data.ts
        # from configurator-input/) then `ng build`.
        # --base-href must match the GitHub Pages project URL path.
        run: npm run build -- --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: SPA redirect fallback for GitHub Pages
        # On a static host, deep links like /tweaks/lavapack hit a non-existent
        # file and GitHub Pages serves 404.html. Redirect to the hash-route form
        # (e.g. /lava-config/#/tweaks/lavapack) so the address bar updates and
        # Angular's HashLocationStrategy takes over cleanly.
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          cat > dist/lava-config2/browser/404.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <title>Redirecting…</title>
            <script>
              (function () {
                var base = "${BASE_PATH}/";
                var p = window.location.pathname;
                var route;
                if (p === base || p === base.slice(0, -1)) {
                  route = "";
                } else if (p.indexOf(base) === 0) {
                  route = p.slice(base.length);
                } else {
                  route = p.replace(/^\//, "");
                }
                route = route.replace(/index\.html$/, "").replace(/^\/+/, "").replace(/\/+$/, "");
                var target = base + "#/" + route + window.location.search;
                window.location.replace(target);
              })();
            </script>
          </head>
          <body>Redirecting…</body>
          </html>
          HTML

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Angular 18 application builder outputs to dist/<project>/browser
          path: dist/lava-config2/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4